# Builds an installable APK with the Russian resources (values-ru).
#
# Why this exists: the engine bundle and the native libraries are prebuilt artefacts, and a locally
# built APK is signed with a different key than the release, so it cannot update the installed app.
# This job builds a *debug* APK with `-Pdsh.appIdSuffix=ru`, i.e. package io.github.jackwener.dsh.ru,
# which installs next to the store build instead of replacing it.
name: RU preview APK

on:
  workflow_dispatch:
  push:
    branches: ['ru/**', 'l10n/**']

concurrency:
  group: ru-apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  apk:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Node 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Android SDK
        uses: android-actions/setup-android@v3

      # compileSdk is 37 (minorApiLevel 2) in app/build.gradle.kts; install whatever exists under that
      # name and let the fallback pick the closest match.
      - name: SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null 2>&1 || true
          for pkg in "platforms;android-37.2" "platforms;android-37" \
                     "build-tools;37.0.0" "build-tools;36.1.0" "build-tools;36.0.0" "platform-tools"; do
            if sdkmanager --install "$pkg" >/dev/null 2>&1; then echo "installed $pkg"; else echo "unavailable: $pkg"; fi
          done
          sdkmanager --list_installed || true

      # libnode.so + JNI wrapper + addons come from this repo's "native-*" release (public, pinned by hash).
      - name: Prebuilt native libraries
        run: WORK="$PWD/toolchains" native/prebuilt.sh fetch

      # engine.zip: npm install of the pinned @deepseek-ai/dsh + our patches.
      - name: Engine bundle
        run: OUT_DIR="$PWD/toolchains/out/engine" js/build-engine.sh

      - name: Build APK
        run: |
          ./gradlew :app:assembleDebug --stacktrace --no-configuration-cache \
            -Pdsh.nativeOut="$PWD/toolchains/out/jniLibs" \
            -Pdsh.engineOut="$PWD/toolchains/out/engine" \
            -Pdsh.appIdSuffix=ru \
            -Pdsh.versionNameSuffix=ru

      - uses: actions/upload-artifact@v4
        with:
          name: dsh-ru-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
